
<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- I added this header to help visitors navigate between the three pages of my website. -->
<header class="header">
    <div class="container">
        <nav>
            <a href="index.html">☕ My Coffee House</a>
            <div>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="pricing.html">Pricing</a>
            </div>

    </div>

        <div class="container">
            <p class="section-label">OUR PRICES</p>

                    <img src="images/three-cups.jpeg" alt="Coffee Drinks">
